# Upload the contents of py_github/ as the repository root.
# Manual builds only: no PyPI upload and no GitHub Release is created.
name: Build Spiral Strip distributions
run-name: Spiral Strip / ${{ inputs.target }} / Python ${{ inputs.python_version }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: System used to test the universal wheel and source archive
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-x86_64
          - windows-x86_64
          - macos-intel
          - macos-apple-silicon
      python_version:
        description: Python version used for installation and smoke tests
        type: choice
        required: true
        default: all
        options:
          - all
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg

jobs:
  build:
    name: Build universal wheel and source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out package source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up build Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build wheel from source archive and validate both distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee logs/build.log) 2>&1
          python -m pip install --upgrade build twine
          python .github/scripts/distributions.py build
      - name: Save distributions and their provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spiralstrip-build
          path: dist/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Save build log even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spiralstrip-logs-build
          path: logs/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  test:
    name: Test Python ${{ matrix.python_version }} / ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["linux-x86_64","windows-x86_64","macos-intel","macos-apple-silicon"]' || format('["{0}"]', inputs.target)) }}
        python_version: ${{ fromJSON(inputs.python_version == 'all' && '["3.10","3.11","3.12","3.13","3.14","3.15"]' || format('["{0}"]', inputs.python_version)) }}
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-24.04","windows-x86_64":"windows-2022","macos-intel":"macos-15-intel","macos-apple-silicon":"macos-15"}')[matrix.target] }}
    timeout-minutes: 30
    steps:
      - name: Check out test and workflow helpers
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up test Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Download the single build used by all test jobs
        uses: actions/download-artifact@v8
        with:
          name: spiralstrip-build
          path: incoming/build
      - name: Install and smoke-test wheel and source in separate clean environments
        shell: bash
        env:
          TEST_TARGET: ${{ matrix.target }}
          TEST_PYTHON: ${{ matrix.python_version }}
        run: |
          set -euo pipefail
          mkdir -p logs
          exec > >(tee logs/test.log) 2>&1
          python .github/scripts/distributions.py test
      - name: Save test log and result even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spiralstrip-logs-${{ matrix.target }}-py${{ matrix.python_version }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  collect:
    name: Collect distributions and logs
    needs: [build, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out collection helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up collection Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download available distributions
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: spiralstrip-build
          path: incoming/build
      - name: Download available build and test diagnostics
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: spiralstrip-logs-*
          path: incoming/logs
      - name: Collect complete job logs, including setup failures
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 4
          retry-exempt-status-codes: 400,401,403,422
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('incoming', {recursive: true});
            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs',
              {...context.repo, run_id: context.runId, filter: 'all', per_page: 100}
            );
            const selected = jobs.filter(job =>
              job.name === 'Build universal wheel and source archive' ||
              job.name.startsWith('Test Python '));
            selected.sort((a, b) => a.name.localeCompare(b.name) || a.id - b.id);
            const log = 'incoming/github-jobs.log';
            const errors = [];
            fs.writeFileSync(log, 'Spiral Strip job logs\nCommit: ' + context.sha + '\n');
            for (const job of selected) {
              fs.appendFileSync(log, '\n' + '='.repeat(80) + '\n' + job.name +
                '\nJob: ' + job.id + '\nResult: ' + job.conclusion +
                '\nURL: ' + job.html_url + '\n' + '='.repeat(80) + '\n');
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                  {...context.repo, job_id: job.id});
                fs.appendFileSync(log, (typeof response.data === 'string'
                  ? response.data : Buffer.from(response.data).toString('utf8')) + '\n');
              } catch (error) {
                const message = job.name + ': ' + error.message;
                errors.push(message);
                fs.appendFileSync(log, 'LOG DOWNLOAD FAILED: ' + message + '\n');
              }
            }
            if (!selected.length) errors.push('No build or test job logs were found.');
            fs.writeFileSync('incoming/log-download-errors.json', JSON.stringify(errors));
      - name: Check completeness, combine logs and calculate SHA-256
        env:
          SELECTED_TARGET: ${{ inputs.target }}
          SELECTED_PYTHON: ${{ inputs.python_version }}
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          TEST_JOB_RESULT: ${{ needs.test.result }}
        run: python .github/scripts/distributions.py collect
      - name: Save PyPI upload files as one ZIP
        if: ${{ success() && needs.build.result == 'success' && needs.test.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: spiralstrip-pypi
          path: |
            release-bundle/*.whl
            release-bundle/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Save combined log separately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: release-bundle/spiralstrip-build.log
          archive: false
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Save diagnostic ZIP even when a build or test failed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spiralstrip-distributions
          path: release-bundle/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
          overwrite: true
